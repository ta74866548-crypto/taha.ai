<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Lesson Summarizer | رفع درس</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .upload-container {
            max-width: 600px;
            margin: 3rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .upload-box {
            border: 2px dashed #3498db;
            padding: 2rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-box:hover {
            background: #f4f7f6;
        }
        #fileInput {
            display: none;
        }
        .status-msg {
            margin-top: 1rem;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">مُلخص الدروس الذكي 🤖</div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="upload.html" class="active">رفع درس جديد</a></li>
                <li><a href="lessons.html">دروسي المحفوظة</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="upload-container">
            <h2>رفع درس جديد</h2>
            <p>اختر ملف PDF أو صورة ليتم تحليلها وتلخيصها</p>
            
            <div class="upload-box" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <p>اضغط هنا لاختيار ملف أو قم بسحبه وإفلاته</p>
                <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg">
            </div>
            
            <button class="btn" id="uploadBtn">رفع وبدء التلخيص</button>
            <div id="statusMessage" class="status-msg"></div>
        </div>
    </main>

    <script src="js/upload.js"></script>
</body>
</html>
